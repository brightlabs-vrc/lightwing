name: CI

on: push

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Frontend Build
        working-directory: frontend
        run: pnpm build

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Disable Encore telemetry
        run: encore telemetry disable

      - name: Export Encore runtime library
        run: echo "ENCORE_RUNTIME_LIB=$(encore daemon env | grep ENCORE_RUNTIME_LIB | cut -d'=' -f2)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm ci

      - name: Run backend unit tests
        run: encore test
