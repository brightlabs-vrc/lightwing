name: CI

on: push

permissions:
  contents: read

jobs:
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: frontend
        run: pnpm ci

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Regenerate frontend API client
        run: encore gen client --output frontend/src/lib/client.ts --lang ts

      - name: Frontend Typecheck
        working-directory: frontend
        run: pnpm typecheck

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Disable Encore telemetry
        run: encore telemetry disable

      - name: Export Encore runtime library
        run: echo "ENCORE_RUNTIME_LIB=$(encore daemon env | grep ENCORE_RUNTIME_LIB | cut -d'=' -f2)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm ci

      - name: Run backend unit tests
        run: encore test

  frontend-visual:
    name: Frontend Visual Tests (Playwright)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: frontend
        run: pnpm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install-deps chromium && npx playwright install chromium

      - name: Start frontend in mock mode
        working-directory: frontend
        run: pnpm dev:mock &

      - name: Wait for server
        working-directory: frontend
        run: npx wait-on http://localhost:5173

      - name: Run visual layout parity tests
        working-directory: frontend
        run: npx playwright test e2e/visual/layout-parity.spec.ts
