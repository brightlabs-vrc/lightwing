name: CI

on: push

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Frontend Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Frontend Unit Tests
        working-directory: frontend
        run: pnpm vitest run

      # The backend embeds the compiled SPA (frontendserve/dist via go:embed),
      # so the frontend must be built before the backend compiles. Encore Cloud
      # does not run frontend builds in the deploy pipeline — dist/ is
      # committed, and this step keeps the embedded copy fresh in CI.
      - name: Frontend Build (embedded by backend)
        working-directory: frontend
        run: pnpm build:encore

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Disable Encore telemetry
        run: encore telemetry disable

      - name: Build backend
        run: |
          go build ./...
          go vet ./...

      - name: Run backend unit tests
        run: encore test ./...
