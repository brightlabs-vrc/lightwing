name: Deno Deploy Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deno-dist:
    name: Deno Deploy Server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm ci

      - name: Build frontend
        run: pnpm frontend:build

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Deno server
        working-directory: frontend/deploy/deno
        run: deno check main.ts api-proxy.ts

      - name: Start Encore backend
        run: |
          encore run &
          ENCORE_PID=$!
          echo "ENCORE_PID=$ENCORE_PID" >> "$GITHUB_ENV"
          # Wait for Encore to be healthy (max 60s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/__encore/healthz > /dev/null 2>&1; then
              echo "Encore healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:4000/__encore/healthz > /dev/null 2>&1; then
            echo "Encore failed to start"
            exit 1
          fi

      - name: Start Deno Deploy server
        env:
          ENCORE_API_BASE_URL: http://127.0.0.1:4000
          FRONTEND_DIST_DIR: frontend/dist
          PORT: 9101
        run: |
          deno run --allow-read --allow-net --allow-env frontend/deploy/deno/main.ts &
          DENO_PID=$!
          echo "DENO_PID=$DENO_PID" >> "$GITHUB_ENV"
          # Wait for Deno server to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9101/ > /dev/null 2>&1; then
              echo "Deno server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:9101/ > /dev/null 2>&1; then
            echo "Deno server failed to start"
            exit 1
          fi

      - name: Test SPA root
        run: |
          RESP=$(curl -s -w "\n%{http_code}" http://localhost:9101/)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -n1)
          echo "Status: $CODE"
          echo "Body length: ${#BODY}"
          # Should return index.html (text/html)
          if [[ "$CODE" != "200" ]]; then
            echo "FAIL: Expected 200, got $CODE"
            exit 1
          fi
          if ! echo "$BODY" | grep -q '<html'; then
            echo "FAIL: Response does not contain HTML"
            exit 1
          fi

      - name: Test asset serving
        run: |
          # Find an actual asset file in dist/
          ASSET=$(find frontend/dist/assets -name '*.js' -type f | head -n1)
          if [ -z "$ASSET" ]; then
            echo "FAIL: No JS assets found in dist/"
            exit 1
          fi
          ASSET_PATH="/assets/$(basename "$ASSET")"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9101"$ASSET_PATH")
          echo "Asset $ASSET_PATH: $CODE"
          if [[ "$CODE" != "200" ]]; then
            echo "FAIL: Expected 200 for asset, got $CODE"
            exit 1
          fi

      - name: Test SPA fallback
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9101/some/nonexistent/route)
          echo "SPA fallback: $CODE"
          if [[ "$CODE" != "200" ]]; then
            echo "FAIL: Expected 200 for SPA fallback, got $CODE"
            exit 1
          fi

      - name: Test auth proxy — get-session
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9101/api/auth/get-session)
          echo "Auth proxy (get-session): $CODE"
          if [[ "$CODE" != "200" ]]; then
            echo "FAIL: Expected 200 from auth proxy, got $CODE"
            exit 1
          fi

      - name: Test auth proxy — CORS headers
        run: |
          RESP_HEADERS=$(curl -s -D - http://localhost:9101/api/auth/get-session -o /dev/null)
          echo "Response headers:"
          echo "$RESP_HEADERS"

          # Verify CORS allows credentials
          if ! echo "$RESP_HEADERS" | grep -qi 'access-control-allow-credentials: *true'; then
            echo "FAIL: Missing access-control-allow-credentials: true"
            exit 1
          fi

          # Verify content-type is JSON
          if ! echo "$RESP_HEADERS" | grep -qi 'content-type: *application/json'; then
            echo "FAIL: Missing content-type: application/json"
            exit 1
          fi

          # Verify Encore trace ID is present (proves request reached Encore)
          if ! echo "$RESP_HEADERS" | grep -qi 'x-encore-trace-id'; then
            echo "FAIL: Missing x-encore-trace-id (request did not reach Encore)"
            exit 1
          fi

      - name: Test auth proxy — Set-Cookie passthrough
        run: |
          # Verify no Set-Cookie with Domain pointing to Encore host
          # (the proxy must not rewrite cookies to the backend origin)
          RESP_HEADERS=$(curl -s -D - http://localhost:9101/api/auth/get-session -o /dev/null)
          if echo "$RESP_HEADERS" | grep -qi 'set-cookie:.*domain=.*encore'; then
            echo "FAIL: Set-Cookie contains Encore domain — proxy rewrote cookie incorrectly"
            exit 1
          fi

      - name: Test auth proxy — 404 for non-auth paths
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9101/api/nonexistent)
          echo "Non-auth path: $CODE"
          if [[ "$CODE" != "404" ]]; then
            echo "FAIL: Expected 404 for /api/nonexistent, got $CODE"
            exit 1
          fi

      - name: Shutdown servers
        if: always()
        run: |
          kill "$ENCORE_PID" "$DENO_PID" 2>/dev/null || true
          wait "$ENCORE_PID" "$DENO_PID" 2>/dev/null || true
